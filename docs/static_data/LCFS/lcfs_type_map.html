<style>
  .lcfs-panel {
    position: fixed;
    top: 12px;
    left: 12px;
    right: auto;
    z-index: 9999;
    background: rgba(255,255,255,0.96);
    padding: 10px 12px;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    font-family: Arial, sans-serif;
    width: 320px;
  }
  .lcfs-panel h4 { margin: 0 0 8px 0; font-size: 14px; }
  .row { margin: 8px 0; }
  .label { font-size: 12px; color: #333; margin-bottom: 4px; }
  .lcfs-panel select, .lcfs-panel input[type="range"] { width: 100%; }

  .rails-box {
    max-height: 160px;
    overflow: auto;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 8px;
    padding: 6px 8px;
    background: rgba(250,250,250,0.95);
  }
  .rail-item {
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
    padding: 3px 0;
    user-select: none;
  }

  .totals {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 9999;
    background: rgba(255,255,255,0.92);
    padding: 10px 12px;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    font-family: Arial, sans-serif;
    font-size: 12px;
    min-width: 220px;
  }
  .totals .big { font-size: 13px; font-weight: 700; margin-bottom: 6px; }

  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.18);
    background: white;
    cursor: pointer;
    font-size: 12px;

    @media screen and (max-width: 900px) and (max-height: 450px) and (orientation: landscape) {

    left: 8px;
    border-radius: 8px;

  .lcfs-panel h4 { font-size: 12px; margin: 0 0 6px 0; }

  .rails-box {
    max-height: 90px;
    padding: 4px 6px;
  }

  .btn { padding: 5px 6px; font-size: 11px; }

<script>
(function () {
  // Write debug status directly into the totals box so you don't depend on console
  function setStatus(msg) {
    var box = document.getElementById("totalsBox");
    if (!box) return;
    var el = document.getElementById("dbgStatus");
    if (!el) {
      el = document.createElement("div");
      el.id = "dbgStatus";
      el.style.marginTop = "8px";
      el.style.fontSize = "11px";
      el.style.color = "#666";
      box.appendChild(el);
    }
    el.textContent = msg;
  }

  function initWhenReady(tries) {
    tries = tries || 0;

    // Folium map var is global: window.map_xxxxx
    var map = window.map_a85fe998eaba6aa83d5814683d3f0536;
    var Lref = window.L;
    var TYPE_COLORS = {"Corn Starch": "gold", "Fiber": "green", "Sorghum": "red", "Wheat": "orange", "Sugar": "purple"};

    if (!Lref) {
      if (tries < 200) { setStatus("Waiting for Leaflet (L)..."); return setTimeout(function(){ initWhenReady(tries+1); }, 50); }
      return setStatus("ERROR: Leaflet (L) never loaded.");
    }

    if (!map) {
      if (tries < 200) { setStatus("Waiting for Folium map object..."); return setTimeout(function(){ initWhenReady(tries+1); }, 50); }
      return setStatus("ERROR: Folium map object never found on window.");
    }

    // ---------- Collect markers (deep) ----------
    function collectMarkersDeep(root) {
      var markers = [];

      function walk(layer) {
        if (!layer) return;

        if (layer instanceof Lref.CircleMarker) markers.push(layer);
        else if (layer instanceof Lref.Marker) markers.push(layer);

        if (layer.eachLayer) {
          layer.eachLayer(function (child) { walk(child); });
        }
      }

      root.eachLayer(function (layer) { walk(layer); });
      return markers;
    }

    var ALL_MARKERS = collectMarkersDeep(map);
    
    
    // ---- DEDUPE (Folium can expose the same marker twice in the layer tree) ----
    var seen = {};
    ALL_MARKERS = ALL_MARKERS.filter(function (mk) {
      var id = mk && mk._leaflet_id;
      if (!id) return true;            // if no id, keep it (rare)
      if (seen[id]) return false;      // already have it
      seen[id] = true;
      return true;
    });
    
    setStatus("Ready. Markers found (deduped): " + ALL_MARKERS.length);
    
    
    
    
    setStatus("Ready. Markers found: " + ALL_MARKERS.length);

    // ---------- DOM refs ----------
    var typeSel = document.getElementById("lcfsType");
    var scoreMin = document.getElementById("scoreMin");
    var scoreVal = document.getElementById("scoreVal");
    var totalsCount = document.getElementById("tCount");
    var totalsCap = document.getElementById("tCap");
    var railsBox = document.getElementById("railsBox");

    if (!typeSel || !scoreMin || !railsBox) {
      return setStatus("ERROR: UI controls not found in DOM.");
    }

    // ---------- helpers ----------
    function getSelectedRails() {
      var cbs = railsBox.querySelectorAll(".rail-cb");
      var out = [];
      cbs.forEach(function (cb) {
        if (cb.checked) out.push(String(cb.value || "").trim().toUpperCase());
      });
      return out;
    }

    function setAllRails(isChecked) {
      var cbs = railsBox.querySelectorAll(".rail-cb");
      cbs.forEach(function (cb) { cb.checked = isChecked; });
    }

    function computeMinMaxForType(selType) {
  var minV = null;
  var maxV = null;

      ALL_MARKERS.forEach(function (mk) {
        var opt = mk.options || {};
        var scores = opt.ci_scores || null;
        if (!scores) return;
    
        function consider(v) {
          if (isNaN(v)) return;
          if (minV === null || v < minV) minV = v;
          if (maxV === null || v > maxV) maxV = v;
        }
    
        if (selType === "Any") {
          for (var k in scores) {
            consider(Number(scores[k]));
          }
        } else {
          consider(Number(scores[selType]));
        }
      });

  if (minV === null || maxV === null) {
    minV = 0;
    maxV = 200;
  }

  return {
    min: Math.floor(minV),
    max: Math.ceil(maxV)
  };
}
     

    function passesType(mk, selType) {
      if (selType === "Any") return true;
      var opt = mk.options || {};
      var types = opt.ci_types || [];
      return types.indexOf(selType) >= 0;
    }

    function scoreForSelectedType(mk, selType) {
      var opt = mk.options || {};
      var scores = opt.ci_scores || null;
      if (!scores) return null;

      if (selType === "Any") {
        var best = null;
        for (var k in scores) {
          var v = Number(scores[k]);
          if (isNaN(v)) continue;
          if (best === null) best = v;
          else best = Math.min(best, v);
        }
        return best;
      }

      var v2 = Number(scores[selType]);
      if (isNaN(v2)) return null;
      return v2;
    }

    function passesRails(mk, selectedRails) {
      if (!selectedRails || selectedRails.length === 0) return true;
    
      var opt = mk.options || {};
      var rails = opt.rail_tokens || [];
    
      // normalize marker rails
      var railsNorm = [];
      if (Array.isArray(rails)) {
        railsNorm = rails.map(function (x) { return String(x || "").trim().toUpperCase(); });
      } else {
        // sometimes comes through as a string
        railsNorm = String(rails || "").split(",").map(function (x) { return String(x || "").trim().toUpperCase(); });
      }

  if (!railsNorm || railsNorm.length === 0) return false;

  for (var i = 0; i < selectedRails.length; i++) {
    if (railsNorm.indexOf(selectedRails[i]) >= 0) return true;
  }
  return false;
}

    function setVisible(mk, on) {
      if (mk && mk.setStyle) {
        if (on) {
          mk.setStyle({ opacity: 1, fillOpacity: 0.85 });
          if (mk.setRadius) mk.setRadius(6);
        } else {
          mk.setStyle({ opacity: 0, fillOpacity: 0 });
          if (mk.setRadius) mk.setRadius(0);
        }
        return;
      }

      var isOn = map.hasLayer(mk);
      if (on && !isOn) mk.addTo(map);
      if (!on && isOn) map.removeLayer(mk);
    }

      function refreshSliderRange() {
      var selType = typeSel.value;
      var mm = computeMinMaxForType(selType);
    
      scoreMin.min = String(mm.min);
      scoreMin.max = String(mm.max);
    
      // default = show everything
      scoreMin.value = String(mm.max);
    
      document.getElementById("scoreMinLbl").textContent = mm.min;
      document.getElementById("scoreMaxLbl").textContent = mm.max;
      scoreVal.textContent = scoreMin.value;
    }

    function applyFilters() {
      var selType = typeSel.value;
      var maxScore = Number(scoreMin.value);
      var selectedRails = getSelectedRails();

      var count = 0;
      var capSum = 0;

      ALL_MARKERS.forEach(function (mk) {
        var opt = mk.options || {};
        var cap = Number(opt.cap || 0);

        var okType = passesType(mk, selType);
        var sc = scoreForSelectedType(mk, selType);
        var okScore = (sc !== null) ? (sc <= maxScore) : false;
        var okRail = passesRails(mk, selectedRails);

        var show = okType && okScore && okRail;

        if (show && mk && mk.setStyle) {
          var c = null;
        
          if (selType === "Any") {
            // Force ALL visible markers to be blue when Any is selected
            c = "blue";
          } else {
            c = TYPE_COLORS[selType] || null;
          }
        
          if (c) mk.setStyle({ color: c, fillColor: c });
        }
        
        setVisible(mk, show);

        if (show) {
          count += 1;
          if (!isNaN(cap)) capSum += cap;
        }
      });

      totalsCount.textContent = String(count);
      totalsCap.textContent = capSum.toLocaleString(undefined, { maximumFractionDigits: 0 });
      setStatus("Ready. Markers found: " + ALL_MARKERS.length + " | Visible: " + count);
    }

    // events
    document.getElementById("railsAll").addEventListener("click", function () { setAllRails(true); applyFilters(); });
    
    setStatus("Checked rails = " + getSelectedRails().join(", "));
    document.getElementById("railsNone").addEventListener("click", function () { setAllRails(false); applyFilters(); });

    typeSel.addEventListener("change", function () { refreshSliderRange(); applyFilters(); });
    scoreMin.addEventListener("input", function () { scoreVal.textContent = scoreMin.value; applyFilters(); });
    railsBox.addEventListener("change", function () { applyFilters(); });

    // init
    setAllRails(true);
    refreshSliderRange();
    applyFilters();
  }

  // Delay init until DOM is ready, then wait for Leaflet + map var
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { initWhenReady(0); });
  } else {
    initWhenReady(0);
  }
})();
</script>
