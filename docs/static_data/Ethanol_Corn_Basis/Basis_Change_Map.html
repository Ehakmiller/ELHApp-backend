    <script>
    (function() {
      function isMobile() {
        return window.matchMedia("(hover: none) and (pointer: coarse)").matches;
      }
    
      function bump() {
        if (!isMobile()) return;
    
        // Try the colormap div id first
        var el = document.getElementById("color_map_4449c862ed59e1dd3608e825aaf42300");
    
        // If branca wrapped it, try common legend selectors
        if (!el) {
          el = document.querySelector(".legend.leaflet-control")
            || document.querySelector(".leaflet-control.legend")
            || document.querySelector(".legend");
        }
        if (!el) return;
    
        var cs = window.getComputedStyle(el);
    
        // Prefer moving by 'top' if top exists; otherwise move by transform
        if (cs.top && cs.top !== "auto") {
          var t = parseFloat(cs.top);
          if (!isNaN(t)) el.style.top = (t + 25) + "px";
        } else {
          // preserve existing transform
          var tr = cs.transform && cs.transform !== "none" ? cs.transform : "";
          el.style.transform = (tr + " translateY(25px)").trim();
        }
      }
    
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bump);
      } else {
        bump();
      }
    
      // retry shortly after load (branca can render late)
      setTimeout(bump, 300);
      setTimeout(bump, 900);
    })();
