<script>
    
    
window.addEventListener('load', function(){
  const map = map_9e1701397472ab82b36f81f5b39d8cad;
  const plantLayer = feature_group_2d3283569f65cde33d410e37d0104ecb;

  let currentClass = "__ANY__";
  let maxCI = 126.33;

     function getMeta(mk){
      let cls = "Other";
      let cap = 0;
      let score = null;
    
      try {
        const pop = mk.getPopup && mk.getPopup();
        if (pop) {
          const html = pop.getContent();  // your popup_html string
          const doc = new DOMParser().parseFromString(html, "text/html");
          const div = doc.querySelector("div[data-class]");
          if (div) {
            const c = (div.getAttribute("data-class") || "").trim();
            const ciStr = (div.getAttribute("data-ci") || "").trim();
            const capStr = (div.getAttribute("data-cap") || "").trim();
    
            if (c) cls = c;
            if (capStr !== "" && !isNaN(Number(capStr))) cap = Number(capStr);
            if (ciStr !== "" && !isNaN(Number(ciStr))) score = Number(ciStr);
          }
        }
      } catch(e) {}
    
      return { cls: cls, cap: cap, score: score };
    }
     
     


      function markerMatches(mk){
        const meta = getMeta(mk);
        const classOk = (currentClass === "__ANY__") || (meta.cls === currentClass);
        const scoreOk = (meta.score == null) ? true : (meta.score <= maxCI);
        return classOk && scoreOk;
      }
    
         function setMarkerVisible(mk, visible){
          mk.__visible = !!visible;
        
          const el = mk.getElement ? mk.getElement() : null;
        
          if (visible) {
            if (el) el.style.display = "";
            mk.setStyle({ opacity: 1, fillOpacity: 0.9 });
            mk.options.interactive = true;
          } else {
            if (el) el.style.display = "none";
            mk.setStyle({ opacity: 0, fillOpacity: 0 });
            mk.options.interactive = false;
            if (mk.closePopup) mk.closePopup();
          }
        }

    console.log("plantLayer type:", plantLayer);
    let layerCount = 0;
   plantLayer.eachLayer(function(mk){
  setMarkerVisible(mk, false);
});
setTimeout(function(){
  plantLayer.eachLayer(function(mk){
    setMarkerVisible(mk, true);
  });
}, 1000);






  const stats = L.control({ position: "bottomleft" });
  stats.onAdd = function(){
    const div = L.DomUtil.create("div", "ci-stats-box");
    div.innerHTML = `
      <div style="font-weight:900;margin-bottom:6px;">Selected plants</div>
      <div id="ci_filters" style="margin-bottom:6px;opacity:0.85;"></div>
      <div id="ci_count">Count: 0</div>
      <div id="ci_cap">Gallons: 0.0 M gal</div>
    `;
    return div;
  };
  stats.addTo(map);

  function refreshStats(){
  let count = 0;
  let capSum = 0;

  plantLayer.eachLayer(function(mk){
    if (!mk || typeof mk.setStyle !== "function" || typeof mk.getPopup !== "function") return;
    if (mk.__visible === false) return;
    const meta = getMeta(mk);
    count += 1;
    capSum += (meta.cap || 0);
  });

  const elCount = document.getElementById("ci_count");
  const elCap   = document.getElementById("ci_cap");
  const elFilt  = document.getElementById("ci_filters");

  if (elCount) elCount.textContent = "Count: " + count.toLocaleString();
  if (elCap)   elCap.textContent   = "Gallons: " + (Math.round(capSum * 10) / 10).toLocaleString() + " M gal";

  const cLabel = (currentClass === "__ANY__") ? "Any CI class" : currentClass;
  const sLabel = "Max CI: " + (Math.round(maxCI * 100) / 100).toLocaleString();
  if (elFilt) elFilt.textContent = cLabel + " • " + sLabel;
}

        function applyFilter(){
      let touched = 0;
      let shown = 0;
    
      plantLayer.eachLayer(function(mk){
        if (!mk || typeof mk.setStyle !== "function" || typeof mk.getPopup !== "function") return;
        touched += 1;
        const vis = markerMatches(mk);
        if (vis) shown += 1;
        setMarkerVisible(mk, vis);
      });
    
      console.log("applyFilter touched:", touched, "shown:", shown, "class:", currentClass, "maxCI:", maxCI);
      refreshStats();
    }



  const filterCtrl = L.control({ position: "topleft" });
  filterCtrl.onAdd = function(){
    const div = L.DomUtil.create("div", "ci-filter-control");
    div.innerHTML = `
      <div class="title">CI Filters</div>

      <label>CI Technology</label>
      <select id="flt_ci_class">
        <option value="__ANY__">Any</option>
        <option value="Corn">Corn</option>
<option value="Fiber">Fiber</option>
<option value="Sorghum">Sorghum</option>
<option value="Wheat">Wheat</option>
<option value="Sugar">Sugar</option>
<option value="Other">Other</option>
      </select>

      <label style="margin-top:10px;">Max CI allowed</label>
      <input id="flt_ci_slider" type="range" min="21.93" max="126.33" step="0.01" value="126.33" />
      <div class="range-row">
        <span>21.93</span>
        <span id="flt_ci_val">126.33</span>
      </div>

      <button id="flt_ci_clear">Clear filters</button>
    `;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  filterCtrl.addTo(map);

  const clsEl = document.getElementById("flt_ci_class");
  const slEl  = document.getElementById("flt_ci_slider");
  const valEl = document.getElementById("flt_ci_val");
  const clrEl = document.getElementById("flt_ci_clear");

  if (clsEl) clsEl.addEventListener("change", function(){
    currentClass = this.value;
    applyFilter();
  });

  if (slEl) slEl.addEventListener("input", function(){
    maxCI = Number(this.value);
    if (valEl) valEl.textContent = String(Math.round(maxCI * 100) / 100);
    applyFilter();
  });

  if (clrEl) clrEl.addEventListener("click", function(){
    currentClass = "__ANY__";
    maxCI = 126.33;
    if (clsEl) clsEl.value = "__ANY__";
    if (slEl) slEl.value = "126.33";
    if (valEl) valEl.textContent = "126.33";
    applyFilter();
  });

  setTimeout(applyFilter, 0);
});
