window.addEventListener('load', function(){
  const map = map_7775b399c05a20e3d821014d56546e08;
  const railFiles = {"BNSF": "geojson/BNSF.geojson", "UP": "geojson/UP.geojson", "CN": "geojson/CN.geojson", "CSX": "geojson/CSX.geojson", "NS": "geojson/NS.geojson"}; // name -> url (relative to HTML)
  const railLayers = {};
  const overlays = {};

  function railStyle(name){
    const colors = {
      "BNSF": "blue",
      "UP": "red",
      "CN": "green",
      "CSX": "purple",
      "NS": "orange"
    };
    return { color: (colors[name] || "gray"), weight: 2, opacity: 0.85 };
  }

  async function ensureRailLoaded(name){
    if (railLayers[name]) return railLayers[name];

    const url = railFiles[name];
    const resp = await fetch(url, { cache: "no-store" });
    if (!resp.ok) {
      console.warn("Rail fetch failed:", name, resp.status, url);
      alert("Failed to fetch rail GeoJSON for " + name + "\nHTTP " + resp.status + "\n" + url);
      return null;
    }

    const gj = await resp.json();
    const layer = L.geoJSON(gj, { style: () => railStyle(name) });
    railLayers[name] = layer;
    return layer;
  }

  // Create placeholders so rails appear in the control immediately
  const placeholders = {};
  Object.keys(railFiles).forEach((name) => {
    const ph = L.layerGroup();      // empty layer group
    placeholders[name] = ph;
    overlays["Rail: " + name] = ph; // appears in LayerControl
  });

  let railControl = L.control.layers(null, overlays, { collapsed: false, position: "topright" }).addTo(map);

  // When user turns ON a placeholder, replace it with the real rail layer
  map.on("overlayadd", async (e) => {
    for (const name of Object.keys(placeholders)) {
      if (e.layer === placeholders[name]) {
        const real = await ensureRailLoaded(name);
        if (!real) return;

        // swap placeholder -> real
        map.removeLayer(placeholders[name]);
        map.addLayer(real);

        // rebuild control to reflect loaded layers
        map.removeControl(railControl);

        const newOverlays = {};
        for (const n of Object.keys(railFiles)) {
          newOverlays["Rail: " + n] = railLayers[n] ? railLayers[n] : placeholders[n];
        }
        railControl = L.control.layers(null, newOverlays, { collapsed: false, position: "topright" }).addTo(map);
        break;
      }
    }
  });
});
