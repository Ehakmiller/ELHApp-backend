window.addEventListener('load', function(){
  // ✅ HARD GUARD: never initialize twice
  if (window.__RAIL_LAZY_CTRL_INIT) {
    console.log("⛔ rails_js already initialized — skipping");
    return;
  }
  window.__RAIL_LAZY_CTRL_INIT = true;

  const map = map_e54148f519e050ba87bf01e944030fd9;
  const railFiles = {"BNSF": "geojson/BNSF.geojson", "UP": "geojson/UP.geojson", "CN": "geojson/CN.geojson", "CSX": "geojson/CSX.geojson", "NS": "geojson/NS.geojson"};   // name -> url (relative to HTML)
  const railLayers = {};
  const placeholders = {};

  // ✅ remove ANY existing Leaflet layer controls (prevents double control UI)
  try {
    document.querySelectorAll('.leaflet-control-layers').forEach((el) => el.remove());
  } catch(e) {}

  function railStyle(name){
    const colors = {
      "BNSF": "blue",
      "UP": "red",
      "CN": "green",
      "CSX": "purple",
      "NS": "orange"
    };
    return { color: (colors[name] || "gray"), weight: 2, opacity: 0.85 };
  }

  async function ensureRailLoaded(name){
    if (railLayers[name]) return railLayers[name];

    const url = railFiles[name];
    const resp = await fetch(url, { cache: "no-store" });
    if (!resp.ok) {
      console.warn("Rail fetch failed:", name, resp.status, url);
      alert("Failed to fetch rail GeoJSON for " + name + "\nHTTP " + resp.status + "\n" + url);
      return null;
    }

    const gj = await resp.json();
    const layer = L.geoJSON(gj, { style: () => railStyle(name) });
    railLayers[name] = layer;
    return layer;
  }

  // ✅ Build overlays map: rail -> placeholder (so checkboxes show immediately)
  function buildOverlays(){
    const overlays = {};
    Object.keys(railFiles).forEach((name) => {
      overlays["Rail: " + name] = railLayers[name] ? railLayers[name] : placeholders[name];
    });
    return overlays;
  }

  // ✅ Create placeholders once
  Object.keys(railFiles).forEach((name) => {
    placeholders[name] = L.layerGroup(); // empty group acts as placeholder
  });

  // ✅ Single control instance (we rebuild by removing/re-adding THIS one only)
  let railControl = L.control.layers(null, buildOverlays(), {
    collapsed: false,
    position: "topleft"
  }).addTo(map);

  railControl.getContainer().classList.add("rail-control");

  console.log("✅ rail control created. controls on page:",
              document.querySelectorAll('.leaflet-control-layers').length);

  // ✅ When user toggles ON a placeholder, swap to real layer and rebuild control
  map.on("overlayadd", async (e) => {
    for (const name of Object.keys(placeholders)) {
      if (e.layer === placeholders[name]) {
        const real = await ensureRailLoaded(name);
        if (!real) return;

        // swap placeholder -> real
        try { map.removeLayer(placeholders[name]); } catch(err) {}
        map.addLayer(real);

        // rebuild the control to point at the real layer instead of the placeholder
        try { map.removeControl(railControl); } catch(err) {}
        railControl = L.control.layers(null, buildOverlays(), {
          collapsed: false,
          position: "topleft"
        }).addTo(map);
        railControl.getContainer().classList.add("rail-control");

        console.log("✅ rail loaded:", name, "controls on page:",
                    document.querySelectorAll('.leaflet-control-layers').length);
        break;
      }
    }
  });
});
    
window.addEventListener('load', function(){
  const map = map_e54148f519e050ba87bf01e944030fd9;

  // IMPORTANT: pull the feature group from window by name
  const plantLayer = feature_group_bd9662ce5409ed716b2247d2a1f35cb0;
  console.log("✅ plants_filter_js running; plant var =", "feature_group_bd9662ce5409ed716b2247d2a1f35cb0", "value:", plantLayer);

  if (!plantLayer) {
    console.warn("Plant layer not found:", "feature_group_bd9662ce5409ed716b2247d2a1f35cb0");
    return;
  }

  let currentTech = "__ANY__";
  let currentRail = "__ANY__";
  let currentEnh  = "__ANY__";

  // ---- Helpers: read marker metadata ----
  function getMeta(mk){
    let tech   = "Unknown";
    let enh    = "__NONE__";
    let majors = "__NOT_ON_MAJOR__";
    let pid    = "";
    let cap    = 0;

    // ✅ Best source: marker options (Folium usually keeps these)
    try {
      const opt = (mk && mk.options) ? mk.options : {};
      if (opt) {
        if (opt.tech != null && String(opt.tech).trim() !== "") tech = String(opt.tech).trim();
        if (opt.majors != null && String(opt.majors).trim() !== "") majors = String(opt.majors).trim();
        if (opt.pid != null && String(opt.pid).trim() !== "") pid = String(opt.pid).trim();
        if (opt.cap != null && !isNaN(Number(opt.cap))) cap = Number(opt.cap) || 0;
      }
    } catch(e) {}

    // Fallback: parse popup HTML if needed
    if (!pid || majors === "__NOT_ON_MAJOR__" || tech === "Unknown") {
      try {
        const pop = mk.getPopup && mk.getPopup();
        if (!pop) return { tech, majors, pid, cap, enh };

        const content = pop.getContent ? pop.getContent() : null;

        let html = "";
        if (typeof content === "string") html = content;
        else if (content && content.outerHTML) html = content.outerHTML;
        else html = String(content || "");

        const mPid  = /data-pid=['"]([^'"]+)['"]/i.exec(html);
        const mTech = /data-tech=['"]([^'"]+)['"]/i.exec(html);
        const mMaj  = /data-majors=['"]([^'"]+)['"]/i.exec(html);
        const mCap  = /data-cap=['"]([^'"]+)['"]/i.exec(html);
        const mEnh  = /data-enh=['"]([^'"]+)['"]/i.exec(html);

        if (mPid)  pid    = mPid[1];
        if (mTech) tech   = mTech[1];
        if (mMaj)  majors = mMaj[1] || "__NOT_ON_MAJOR__";
        if (mCap)  cap    = Number(String(mCap[1]).replace(/,/g,"")) || cap || 0;
        if (mEnh)  enh    = mEnh[1] || "__NONE__";
      } catch(e) {}
    }

    return { tech, majors, pid, cap, enh };
  }

  function markerMatches(mk){
    const meta = getMeta(mk);

    const techOk =
      (currentTech === "__ANY__") ||
      (meta.tech === currentTech);

    let railOk = true;
    if (currentRail === "__ANY__") {
      railOk = true;
    } else if (currentRail === "__NOT_ON_MAJOR__") {
      railOk = (meta.majors === "__NOT_ON_MAJOR__");
    } else {
      railOk = String(meta.majors || "").split("|").includes(currentRail);
    }

    let enhOk = true;
    if (currentEnh === "__ANY__") {
      enhOk = true;
    } else if (currentEnh === "__NONE__") {
      enhOk = (meta.enh === "__NONE__");
    } else {
      enhOk = String(meta.enh || "").split("|").includes(currentEnh);
    }

    return techOk && railOk && enhOk;
  }

  function setMarkerVisible(mk, visible){
    if (!mk || !mk.setStyle) return;

    // remember visibility state for stats
    mk.__visible = !!visible;

    if (visible) {
      mk.setStyle({ opacity: 1, fillOpacity: 0.9 });
      mk.options.interactive = true;
    } else {
      mk.setStyle({ opacity: 0, fillOpacity: 0 });
      mk.options.interactive = false;
      if (mk.closePopup) mk.closePopup();
    }
  }

  // ---- Stats box ----
  const box = L.control({ position: "bottomleft" });
  box.onAdd = function(){
    const div = L.DomUtil.create("div", "plant-stats-box");
    div.innerHTML = `
      <div style="font-weight:700;margin-bottom:6px;">Selected plants</div>
      <div id="ps_filters" style="margin-bottom:6px;opacity:0.8;"></div>
      <div id="ps_count">Count: 0</div>
      <div id="ps_cap">Capacity: 0.0 M gal</div>
    `;
    return div;
  };
  box.addTo(map);

  function refreshStats(){
    const seen = new Set();
    let capSum = 0;

    plantLayer.eachLayer(function(mk){
      if (!mk.__visible) return;

      const meta = getMeta(mk);
      const k = meta.pid || ("mk_" + (mk._leaflet_id || ""));
      if (seen.has(k)) return;

      seen.add(k);
      capSum += (meta.cap || 0);
    });

    const elCount = document.getElementById("ps_count");
    const elCap   = document.getElementById("ps_cap");
    const elFilt  = document.getElementById("ps_filters");

    if (elCount) elCount.textContent = "Count: " + seen.size.toLocaleString();
    if (elCap)   elCap.textContent   = "Capacity: " + (Math.round(capSum * 10) / 10).toLocaleString() + " M gal";

    const tLabel = (currentTech === "__ANY__") ? "Any Tech" : currentTech;
    const rLabel = (currentRail === "__ANY__") ? "Any Rail"
                 : (currentRail === "__NOT_ON_MAJOR__") ? "Not on major"
                 : currentRail;
    const eLabel = (currentEnh === "__ANY__") ? "Any Enhanced"
                 : (currentEnh === "__NONE__") ? "No Enhanced"
                 : currentEnh;

    if (elFilt) elFilt.textContent = tLabel + " • " + rLabel + " • " + eLabel;
  }

  function applyFilter(){
    plantLayer.eachLayer(function(mk){
      setMarkerVisible(mk, markerMatches(mk));
    });
    refreshStats();
  }

  // ---- Filter UI ----
  const filterCtrl = L.control({ position: "topleft" });
  filterCtrl.onAdd = function(){
    const div = L.DomUtil.create("div", "filter-control");

    div.innerHTML = `
      <div style="font-weight:700;margin-bottom:6px;">Plant Filters</div>

      <div>Technology</div>
      <select id="flt_tech">
        <option value="__ANY__">Any</option>
        <option value="ADM">ADM</option>
<option value="Delta-T">Delta-T</option>
<option value="ICM">ICM</option>
<option value="Katzen">Katzen</option>
<option value="Lurgi">Lurgi</option>
<option value="Poet">Poet</option>
<option value="Unknown">Unknown</option>
<option value="Verbio">Verbio</option>
<option value="Vogelbusch">Vogelbusch</option>
<option value="Waste Stream">Waste Stream</option>
<option value="Wet Mill">Wet Mill</option>
<option value="Wheat">Wheat</option>
      </select>

      <div style="margin-top:6px;">Enhanced Tech</div>
      <select id="flt_enh">
        <option value="__ANY__">Any</option>
        <option value="__NONE__">None</option>
        <option value="High Pro">High Pro</option>
<option value="CHP">CHP</option>
<option value="White Fox">White Fox</option>
<option value="DCO Enhancement">DCO Enhancement</option>
<option value="C02 Pipeline -Direct">CO2 Pipeline (Direct)</option>
<option value="C02 Pipeline -3rd Party">CO2 Pipeline (3rd Party)</option>
      </select>

      <div style="margin-top:6px;">Rail</div>
      <select id="flt_rail">
        <option value="__ANY__">Any</option>
        <option value="BNSF">BNSF</option>
        <option value="UP">UP</option>
        <option value="CN">CN</option>
        <option value="CSX">CSX</option>
        <option value="NS">NS</option>
        <option value="__NOT_ON_MAJOR__">Not on major</option>
      </select>

      <button id="flt_clear" style="margin-top:6px;width:100%;">Clear filters</button>
    `;

    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  filterCtrl.addTo(map);

  const techEl = document.getElementById("flt_tech");
  const enhEl  = document.getElementById("flt_enh");
  const railEl = document.getElementById("flt_rail");
  const clrEl  = document.getElementById("flt_clear");

  if (techEl) techEl.addEventListener("change", function(){
    currentTech = this.value;
    applyFilter();
  });

  if (enhEl) enhEl.addEventListener("change", function(){
    currentEnh = this.value;
    applyFilter();
  });

  if (railEl) railEl.addEventListener("change", function(){
    currentRail = this.value;
    applyFilter();
  });

  if (clrEl) clrEl.addEventListener("click", function(){
    currentTech = "__ANY__";
    currentRail = "__ANY__";
    currentEnh  = "__ANY__";
    if (techEl) techEl.value = "__ANY__";
    if (enhEl)  enhEl.value  = "__ANY__";
    if (railEl) railEl.value = "__ANY__";
    applyFilter();
  });

  applyFilter();
});
