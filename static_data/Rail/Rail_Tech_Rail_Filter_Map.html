<script>
(function(){
  const map = map_076ec1da9f835bc102773e16a0062beb;
  const railFiles = {"BNSF": "geojson/BNSF.geojson", "UP": "geojson/UP.geojson", "CN": "geojson/CN.geojson", "CSX": "geojson/CSX.geojson", "NS": "geojson/NS.geojson"}; // name -> url
  const railLayers = {};
  const overlays = {};

  function railStyle(name){
    const colors = {
      "BNSF": "blue",
      "UP": "red",
      "CN": "green",
      "CSX": "purple",
      "NS": "orange"
    };
    return { color: (colors[name] || "gray"), weight: 2, opacity: 0.85 };
  }

  async function ensureRailLoaded(name){
    if (railLayers[name]) return railLayers[name];
    const url = railFiles[name];
    const resp = await fetch(url, {cache: "no-store"});
    if(!resp.ok) {
      alert("Failed to fetch " + name + " rail geojson. HTTP " + resp.status + "\n" + url);
      return null;
    }
    const gj = await resp.json();
    const layer = L.geoJSON(gj, {style: railStyle(name)});
    railLayers[name] = layer;
    return layer;
  }

  // Create a control with "placeholder" layers that load on first toggle.
  // We make dummy LayerGroups and swap them when activated.
  const placeholders = {};

  Object.keys(railFiles).forEach((name) => {
    const ph = L.layerGroup();
    placeholders[name] = ph;
    overlays["Rail: " + name] = ph;
  });

  const railControl = L.control.layers(null, overlays, {collapsed:false, position:"topright"}).addTo(map);

  map.on("overlayadd", async (e) => {
    // If user toggled a rail placeholder on, load the rail and replace.
    for (const name of Object.keys(placeholders)) {
      if (e.layer === placeholders[name]) {
        const real = await ensureRailLoaded(name);
        if(!real) return;

        // remove placeholder
        map.removeLayer(placeholders[name]);

        // add real layer
        map.addLayer(real);

        // Update control: remove placeholder entry, add real entry
        // Leaflet doesn't expose a direct API to replace entries, so we rebuild the control.
        map.removeControl(railControl);

        const newOverlays = {};
        for (const n of Object.keys(railFiles)) {
          if (n === name) newOverlays["Rail: " + n] = real;
          else {
            // keep existing real if loaded, otherwise placeholder
            newOverlays["Rail: " + n] = railLayers[n] ? railLayers[n] : placeholders[n];
          }
        }
        L.control.layers(null, newOverlays, {collapsed:false, position:"topright"}).addTo(map);
        break;
      }
    }
  });
})();
</script>

", "Poet on CSX": "feature_group_39c0284b9f0deb6887eb4f18a24d0b92", "Poet on KCS": "feature_group_90d5def2685a52acc75cfe0d04211805", "Poet on NS": "feature_group_29fefbe2163a34c86a1bb45130cab7b2", "Poet on UP": "feature_group_6daf46e559321ffb3b122afd48a0eb40", "Vogelbusch on AC1s": "feature_group_5340bcd5e1a45469ff2f8356042362b4", "Vogelbusch on BNSF": "feature_group_e7de360e183f8821fc604098d189a5c4", "Vogelbusch on CN": "feature_group_f5427531ae42b815758a359c6adbf6ac", "Vogelbusch on CSX": "feature_group_f1383bf00567b0c4aefc2577a4ab1d92", "Vogelbusch on IMRR": "feature_group_799032bdeda37dd2db8ad161e7ec9891", "Vogelbusch on NS": "feature_group_f4750e08f8f4c221f65ab3b2a032a21a", "Vogelbusch on PH": "feature_group_e7e03a7bd1069d422f6bdf5bd008315d", "Vogelbusch on UP": "feature_group_621319d754bc9cd3eafc61e46aa09e71", "Wet Mill on BNSF": "feature_group_0f38f0d5eb52ba460d6846d6994978ad", "Wet Mill on CN": "feature_group_66b8534c0a66030fdd6a891dc3895667", "Wet Mill on CP": "feature_group_e85e70bbd28496daebc6265f24929132", "Wet Mill on CSX": "feature_group_cb5153f8b697d2967dc78af5d3e7c6ab", "Wet Mill on IAIS": "feature_group_0e2cce3f02e8eea47c276ea6a208ef46", "Wet Mill on NS": "feature_group_83a8578836b07d90247fbf50ee7ad9a7", "Wet Mill on UP": "feature_group_bf6bd02ec453b7672f6ca6f932c1176a", "Wheat on UP": "feature_group_513051d4beb27cf47ec4bacb79ed3875", "Verbio on UP": "feature_group_1c3233ad1f7832ab5b02bb422cff394f"}; // label -> JS var name (FeatureGroup)

          const pop = mk.getPopup();
          if(!pop) return;
          const html = pop.getContent();
          // read hidden div: data-pid + data-cap
          const m1 = /data-pid='([^']+)'/.exec(html);
          const m2 = /data-cap='([^']+)'/.exec(html);

          const pid = m1[1];
          const c = parseFloat(m2[1] || "0");
          if(!seen.has(pid)) {
            seen.add(pid);
            cap += c;
          }
        } catch(e) {}
      });
    });

    return {count: seen.size, cap};
  }

  function refresh(){
    const r = scanVisiblePlantLayers();
    const c = document.getElementById("ps_count");

  }

  map.on("overlayadd", refresh);
  map.on("overlayremove", refresh);
  refresh();
})();
