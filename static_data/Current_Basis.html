<style>
  /* =========================
     UNIVERSAL (all devices)
     ========================= */
  html, body { height: 100%; width: 100%; margin: 0; padding: 0; }

  /* Folium/Leaflet map container(s) */
  .folium-map, div[id^="map_"] { height: 100vh !important; width: 100vw !important; }

  /* Hide things on phones */
  .desktop-only { display: block; }

  /* “card” style overlay */
  .map-card{
    position: fixed;
    z-index: 9999;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    border: 1px solid rgba(0,0,0,0.08);
    padding: 10px 12px;
    font-family: Arial, sans-serif;
  }

  /* Title */
  .map-title{
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    max-width: min(92vw, 520px);
    text-align: center;
  }
  .map-title h3{ margin: 0; font-size: 18px; line-height: 1.15; }

  /* Legend (desktop default) */
  .map-legend{
    top: 40px;
    right: 10px;
    max-width: min(60vw, 360px);
    font-size: 12px;
  }
  .map-legend summary{ cursor: pointer; font-weight: 700; }

  /* Charts panel (desktop default) */
  .chart-panel{
    top: 70px;
    left: 10px;
    width: 190px;
  }

  /* Make LayerControl easier to tap */
  .leaflet-control-layers{ font-size: 14px; }
  .leaflet-control-layers-toggle{ width: 44px !important; height: 44px !important; }
  .leaflet-control-layers-expanded{
    max-height: 60vh !important;
    overflow-y: auto !important;
  }

  /* Branca colorbar (LinearColormap) */
  .leaflet-top.leaflet-right .legend.leaflet-control{
    margin-right: 50px !important;
  }
  .legend.leaflet-control svg g.tick text{
    font-size: 12px !important;
    font-weight: 500;
  }

  /* Watermarks (desktop default) */
  .market-watermark{
    position: fixed;
    top: 100px;
    right: 75px;
    z-index: 9999;
    padding: 2px;
  }
  .market-watermark img{
    width: 350px;
    height: auto;
    opacity: 0.85;
  }

  .personal-watermark{
    position: fixed;
    bottom: 20px;
    right: 45px;
    z-index: 9999;
  }
  .personal-watermark img{
    width: 200px;
    height: auto;
  }

  /* “FAB” button (if you use it) */
  .fab{
    position: fixed;
    left: 14px;
    bottom: 14px;
    z-index: 10000;
    border: none;
    border-radius: 999px;
    padding: 12px 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    background: rgba(255,255,255,0.92);
    font-weight: 700;
  }

  /* Modal for charts */
  #chart-modal{
    display:none;
    position: fixed;
    inset: 0;
    z-index: 20000;
    background: rgba(0,0,0,0.08);
  }
  #chart-modal .inner{
    position: absolute;
    left: 14px;
    bottom: 14px;
    width: min(720px, 50vw);
    height: 50vh;
    background: rgba(255,255,255,0.92);
    border-radius: 14px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 10px;
  }
  #chart-modal img{ max-width: 100%; max-height: 100%; height: auto; width: auto; }
  #chart-modal .close{
    position: absolute;
    top: 8px;
    right: 10px;
    border: none;
    border-radius: 10px;
    padding: 8px 10px;
    font-weight: 800;
  }

  /* Labels never intercept taps */
  .city-label{ pointer-events:none !important; }
  .leaflet-div-icon.city-label-icon{
    pointer-events:none !important;
    background: transparent !important;
    border: none !important;
  }

  /* Keep Leaflet controls below your map-card overlays */
  .leaflet-top, .leaflet-bottom{ z-index: 9000 !important; }

  /* =========================
     DESKTOP-SPECIFIC
     ========================= */
  .leaflet-top.leaflet-right .leaflet-control-layers{
    margin-top: 2px !important;
  }

  /* =========================
     MOBILE OVERRIDES (phones)
     ========================= */
  @media (max-width: 768px){

    .desktop-only { display:none !important; }
    .map-title h3{ font-size: 16px; }

    /* Move top-right Leaflet controls below title */
    .leaflet-top.leaflet-right{ top: 85px !important; }

    /* Branca colorbar tighter on phone */
    .leaflet-top.leaflet-right .legend.leaflet-control{
      margin-right: 10px !important;
    }
    .legend.leaflet-control svg text{
      font-size: 12px !important;
    }

    /* Legend at bottom — moved UP 20px */
    .map-legend{
      bottom: 34px !important;   /* was 14px */
      top: auto !important;
      left: 10px !important;
      right: 10px !important;
      max-width: 92vw;
    }

    /* Hide desktop chart panel on phone */
    .chart-panel{ display:none !important; }

    /* Modal sizing on phone */
    #chart-modal .inner{
      left: 10px;
      bottom: 10px;
      width: 92vw;
      height: 60vh;
    }

    /* Watermarks smaller on phone */
    .market-watermark{ top: 70px; right: 10px; }
    .market-watermark img{ width: 140px; }
    .personal-watermark{ bottom: 10px; right: 10px; }
    .personal-watermark img{ width: 120px; }

    /* HARD STOP: never show Leaflet tooltips on phones */
    .leaflet-tooltip{ display:none !important; }
  }
</style>

<script>
(function() {
  function syncCityLabels() {
    var map = map_76d73d5e599ac6c0a1e2518030dbd9bf;
    var labels = feature_group_d20120ec04c96267d3fed8884e498d31;
    if(!map || !labels) return;

    // Match your CSS breakpoint: phone is <= 768px
    var desktop = window.matchMedia("(min-width: 769px)").matches;

    if(desktop) {
      if(!map.hasLayer(labels)) map.addLayer(labels);
    } else {
      if(map.hasLayer(labels)) map.removeLayer(labels);
    }
  }

  // run once after render
  setTimeout(syncCityLabels, 0);

  // keep correct if someone rotates/resizes
  window.addEventListener("resize", function() {
    clearTimeout(window.__cityLblTimer);
    window.__cityLblTimer = setTimeout(syncCityLabels, 150);
  });
})();
</script>

  <button onclick="openChart('state')" style="display:block; width:100%; margin-bottom:6px;">State Avg (modal)</button>
  <button onclick="openChart('top_ten')" style="display:block; width:100%; margin-bottom:10px;">Top Ten (modal)</button>

  <button onclick="openChartNewTab('state')" style="display:block; width:100%; margin-bottom:6px;">State Avg (new tab)</button>

<div id="chart-modal" onclick="closeChart(event)">
  <div class="inner">
    <button class="close" onclick="forceClose()">✕</button>
    <img id="chart-img" src="" alt="Chart"/>
  </div>
</div>

<script>
const charts = {
  state: "state_avg.png?v=121625",
  top_ten: "lcfs_top_ten.png?v=121625"
};


function openChart(key){
  const src = charts[key] || "";
  if(!src) return;
  document.getElementById("chart-img").src = src;
  document.getElementById("chart-modal").style.display = "block";
}

function openChartNewTab(key){
  const src = charts[key] || "";
  if(!src) return;
  window.open(src, "_blank", "noopener,noreferrer");
}

function closeChart(e){
  if(e.target.id === "chart-modal") {
    forceClose();
  }
}

function forceClose(){
  document.getElementById("chart-modal").style.display = "none";
  document.getElementById("chart-img").src = "";
}

function toggleCharts(){
  const p = document.getElementById("chart-panel");
  if(!p) return;
  p.style.display = (p.style.display === "none" || p.style.display === "") ? "block" : "none";
}

document.addEventListener("keydown", function(e){
  if(e.key === "Escape") forceClose();
});
</script>
